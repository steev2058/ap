apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt' // for dataBinding in Kotlin
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-parcelize'
apply plugin: 'androidx.navigation.safeargs'
apply plugin: 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'

android {
    compileSdkVersion 33
    lintOptions {

        checkReleaseBuilds false

    }
    defaultConfig {
        applicationId "com.apps2you.albaraka"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 44
        versionName "3.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization
            minifyEnabled true

            // Enables resource shrinking, which is performed by the Android Gradle plugin.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    bundle {
        language {
            // Specifies that the app bundle should not support configuration APKs for language resources.
            // These resources are instead packaged with each base and dynamic feature APK.
            enableSplit = false
        }
    }

    dataBinding {
        enabled = true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            
        }
    }
    ndkVersion '24.0.8215888'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation 'androidx.viewpager2:viewpager2:1.0.0' // enables RtL
    implementation "com.google.android.material:material:1.4.0-beta01" // for RtL TabLayoutMediator
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'

    // Navigation Component
    def nav_version = "2.4.2"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$nav_version"

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.4.1"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation "com.google.dagger:dagger:$rootProject.dagger2Version"
    kapt "com.google.dagger:dagger-compiler:$rootProject.dagger2Version"
    kapt "com.google.dagger:dagger-android-processor:$rootProject.dagger2Version"
    implementation "com.google.dagger:dagger-android-support:$rootProject.dagger2Version"

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.8.0'
    implementation 'com.google.code.gson:gson:2.8.8'

    implementation 'com.google.android.gms:play-services-location:20.0.0' // to get current location
    implementation 'com.google.android.gms:play-services-maps:18.0.2'  // to display branches on map

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'com.github.f0ris.sweetalert:library:1.5.1'

    implementation "com.airbnb.android:lottie:3.7.0"  // for splash logo animation

    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation "androidx.biometric:biometric:1.1.0"

    implementation platform('com.google.firebase:firebase-bom:30.5.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation ('com.google.firebase:firebase-analytics') {
        // when including ads-identifier, Google Play store gives warning about finding ads
        exclude module: "play-services-ads-identifier"
    }
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'io.github.inflationx:viewpump:2.0.3'

    // Dimens
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'


    // PinView
    implementation 'io.github.chaosleung:pinview:1.4.4'

    // Rounded ImageView
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation "androidx.browser:browser:1.4.0" // for services bills

    // for Qr payment
    implementation "com.google.zxing:core:3.5.0"
    implementation 'com.journeyapps:zxing-android-embedded:3.2.0@aar'

    implementation "com.android.support:appcompat-v7:25.3.1"
    implementation "com.android.support:design:25.3.1"

    //for sep
    implementation 'com.squareup.picasso:picasso:2.71828'


    // RxJava
    def rxJavaVersion = '2.2.19'
    def rxAndroidVersion = '2.1.1'
    implementation "io.reactivex.rxjava2:rxjava:$rxJavaVersion"
    implementation "io.reactivex.rxjava2:rxandroid:$rxAndroidVersion"

    //for kyc
    implementation 'me.dm7.barcodescanner:zxing:1.9.8'
    implementation 'com.github.shuhart:stepview:1.5.1'
    implementation 'io.github.chaosleung:pinview:1.4.4'


    //fro my financing
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.salehyarahmadi:DataTable:v1.0.1'

    //for location
    implementation 'com.github.lzyzsd:circleprogress:1.1.0'

}
repositories {
    mavenCentral()

}
